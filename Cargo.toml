[package]
name = "nedit"
version = "0.1.5"
edition = "2024"
authors = ["Norbert Winter"]
description = "nEdit – nativer LaTeX-Editor in Rust: Live-PDF, visueller Modus, Literatur-Bibliothek, Präsentationen (TU-Graz-Beamer), Git"
license = "MIT"
repository = "https://github.com/jwm3000/nedit"
readme = "README.md"
keywords = ["latex", "editor", "thesis", "beamer", "bibtex"]
categories = ["text-editors", "gui"]

[dependencies]
dirs = "7.0.0"
eframe = "0.36.2"
egui = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
regex = "1.13.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.4.2"
toml = "0.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
