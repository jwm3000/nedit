name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: nedit-linux-x86_64, bin: nedit, archive: tar.gz, raw: nedit-linux-x86_64 }
          - { os: windows-latest, name: nedit-windows-x86_64, bin: nedit.exe, archive: zip, raw: nedit-windows-x86_64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libasound2-dev pkg-config
      - run: cargo build --release
      - name: Paket schnüren
        shell: bash
        run: |
          mkdir -p pkg/${{ matrix.name }} dist
          cp target/release/${{ matrix.bin }} README.md LICENSE pkg/${{ matrix.name }}/
          cp -r assets pkg/${{ matrix.name }}/
          cd pkg
          if [ "${{ matrix.archive }}" = "zip" ]; then 7z a ../dist/${{ matrix.name }}.zip ${{ matrix.name }}; else tar czf ../dist/${{ matrix.name }}.tar.gz ${{ matrix.name }}; fi
          cd ..
          # plain binary for nEdit's built-in updater
          cp target/release/${{ matrix.bin }} dist/${{ matrix.raw }}
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.name }}.${{ matrix.archive }}
            dist/${{ matrix.raw }}

  macos:
    name: nedit-macos-universal
    runs-on: macos-latest
    env:
      # optional: with these secrets the app is signed with a Developer ID and notarized
      # (macOS then opens it without asking); without them it is signed ad-hoc
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Developer-ID-Zertifikat laden (falls hinterlegt)
        if: env.MACOS_CERT_P12 != ''
        run: |
          KC=$RUNNER_TEMP/build.keychain
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: nEdit.app bauen (Apple Silicon + Intel)
        run: packaging/macos/build-app.sh dist
      - name: Starttest
        run: dist/nEdit.app/Contents/MacOS/nedit --version
      - name: Ältere Updater (≤ 0.5) erwarten diesen Namen
        run: cp dist/nedit-macos-universal dist/nedit-macos-arm64
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nEdit-macOS.dmg
            dist/nEdit-macOS.zip
            dist/nedit-macos-universal
            dist/nedit-macos-arm64
