<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: 824×824 body, centred a little high, soft shadow below -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9b06a"/>
      <stop offset="1" stop-color="#c9824a"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="100" y="90" width="824" height="824" rx="185" fill="url(#g)" filter="url(#s)"/>
  <text x="512" y="704" text-anchor="middle" font-family="Libertinus Serif" font-size="560" font-weight="600" fill="#1b1a1f">∂</text>
</svg>
